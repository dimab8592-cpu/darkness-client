plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

loom {
	mods {
		"darknessclient" {
			sourceSet sourceSets.main
		}
	}

	runs {
		client {
			client()
			programArgs "--quickPlaySingleplayer", "Новый мир"
		}
	}
}

repositories {
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	annotationProcessor "net.fabricmc:fabric-loader:${project.loader_version}"

	// MP3-декодер для кастомных звуков (тотем/крит) — вшивается внутрь нашего jar
	implementation "javazoom:jlayer:1.0.1"
	include "javazoom:jlayer:1.0.1"
}

processResources {
	def version = project.mod_version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_darkness-client" }
	}
}
